<!--
  Nexus Desktop app icon (source of truth for build/icon.*)

  Rendered by scripts/make-icon.cjs at 1024px and downscaled to the .ico / .icns / PNG sets.
  Keep this file a full-bleed 1024x1024 canvas; the tile silhouette lives inside an 824px
  safe area so platform masks (macOS squircle, Windows shell) never clip the artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1a2231"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#84b4ff"/>
      <stop offset="1" stop-color="#4680ef"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle tile: 824px inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- N drawn as one continuous connection path; bevel joins keep the acute
       corners flat instead of growing miter spikes -->
  <path d="M 366 696 L 366 328 L 658 696 L 658 328"
        fill="none" stroke="url(#mark)" stroke-width="84"
        stroke-linecap="round" stroke-linejoin="bevel"/>

  <!-- endpoint nodes: the two agents joined through Nexus -->
  <circle cx="366" cy="696" r="58" fill="#d3e4ff"/>
  <circle cx="658" cy="328" r="58" fill="#d3e4ff"/>
</svg>
