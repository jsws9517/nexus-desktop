name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@jsws9517'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Obfuscate
        run: npm run obfuscate

      - name: Prepare Electron native
        run: npm run prepare:electron-native

      - name: Build installer
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Get version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Nexus Desktop ${{ steps.version.outputs.tag }}

            AI Agent 桌面客户端 - 连接本地与云端智能。

            ### 系统要求
            - Windows 10/11 (64-bit)

            ### 安装说明
            1. 下载下方安装程序
            2. 双击运行，选择安装目录
            3. 启动后在 Settings 中配置 API Key

            ### 功能特性
            - **多模型支持** - Claude、GPT 等主流大语言模型，统一接口切换
            - **MCP 协议** - 原生支持 Model Context Protocol，连接丰富工具生态
            - **会话管理** - SQLite 存储，与 CLI 共享数据
            - **流式响应** - 实时对话，支持思维链展示
            - **消息队列** - Agent 忙时自动排队
            - **内嵌配置** - Web UI 配置 Provider / Vision / MCP / Skills

            ### 技术栈
            Electron 43 · TypeScript · Node.js · SQLite · Anthropic SDK · OpenAI SDK · MCP SDK

            ### 更新日志
            See [commit history](https://github.com/jsws9517/nexus-desktop/commits/${{ github.ref_name }}) for details.
          files: release/nexus Setup ${{ steps.version.outputs.tag }}.exe
          repository: jsws9517/nexus-releases
          token: ${{ secrets.RELEASE_TOKEN }}
