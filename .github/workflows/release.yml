name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify core signing key
        shell: bash
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
        run: |
          # Fail before the ~4 minute build if the release cannot sign the core
          # manifest; otherwise the publish step fails after the installer is
          # already produced and no release is created.
          if [ -z "${CORE_SIGNING_KEY}" ]; then
            echo "::error::CORE_SIGNING_KEY secret is missing."
            exit 1
          fi
          case "$CORE_SIGNING_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::CORE_SIGNING_KEY is not a PEM private key."; exit 1 ;;
          esac

      - name: Get version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        shell: bash
        run: |
          node scripts/set-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail

          # Previous tag = nearest tag reachable from the parent of HEAD
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            RANGE="HEAD"
          else
            # Get commits since previous tag
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Collect commits (no merges), one "subject \x1f short-sha" per line
          LOG=$(git log --no-merges --pretty=format:"%s%x1f%h" "$RANGE")

          TMP=$(mktemp -d)
          for k in feat fix perf refactor chore docs test build ci style other; do
            : > "$TMP/$k"
          done

          while IFS=$'\x1f' read -r subj sha; do
            case "$subj" in
              feat:*)      g=feat ;;
              fix:*)       g=fix ;;
              perf:*)      g=perf ;;
              refactor:*)  g=refactor ;;
              chore:*)     g=chore ;;
              docs:*)      g=docs ;;
              test:*)      g=test ;;
              build:*|ci:*) g=build ;;
              style:*)     g=style ;;
              *)           g=other ;;
            esac
            printf -- "- %s ([%s](https://github.com/%s/commit/%s))\n" "$subj" "$sha" "$GITHUB_REPOSITORY" "$sha" >> "$TMP/$g"
          done <<< "$LOG"

          BODY=".release_body.md"
          cat > "$BODY" <<'MD'
          ## Nexus Desktop ${{ steps.version.outputs.tag }}

          AI Agent desktop client - connect local and cloud intelligence.

          ### System Requirements
          - Windows 10/11 (64-bit)
          - Linux x64 (AppImage or deb)
          - macOS 14+ (Apple Silicon) — beta, ad-hoc signed (see note below)

          ### Installation

          **Windows**
          1. Download `nexus-Setup-${{ steps.version.outputs.tag }}.exe`
          2. Run it and choose the install directory
          3. Launch the app and set your API Key in Settings

          **Linux (AppImage)**
          ```bash
          chmod +x nexus-x86_64.AppImage
          ./nexus-x86_64.AppImage
          ```
          - Ubuntu 22.04+ / Debian 12+ ships `libfuse2`; on distros without it install the
            `libfuse2` package, or run `./nexus-x86_64.AppImage --appimage-extract-and-run`
            to bypass FUSE entirely.
          - Integrate with your desktop (optional): install [AppImageLauncher](https://github.com/AppImageLauncher/AppImageLauncher)
            and right-click → "Integrate and Launch" to get a `.desktop` entry.

          **Linux (deb)**
          ```bash
          sudo apt install ./nexus-${{ steps.version.outputs.tag }}-amd64.deb
          ```
          Installs to `/opt/nexus` with a `/usr/bin/nexus` wrapper and a desktop entry.

          **macOS (arm64, beta)**
          1. Download `nexus-${{ steps.version.outputs.tag }}-arm64.dmg`
          2. Open it and drag `nexus` to `/Applications`
          3. **Right-click → Open** (or run
             `xattr -dr com.apple.quarantine /Applications/nexus.app`) — the app is
             ad-hoc signed and not yet notarized, so Gatekeeper will show
             "developer cannot be verified" on first launch. This is expected
             at the beta stage and is unrelated to the app's behavior.

          ### In-app Updates
          - Windows: the installer self-updates; no extra steps needed.
          - Linux AppImage: the app downloads a differential update and swaps the file on quit.
          - Linux deb: the app downloads the new `.deb` and requests system authorization
            (polkit / `pkexec`) to install. If the prompt is unavailable, fall back to a
            manual `sudo apt install` of the new `.deb` in this release.
          - macOS: updates are not yet supported (beta stage). Re-download the latest
            `.dmg` when a new release appears.

          ### Features
          - **Multi-model support** - Claude, GPT and other major LLMs, unified interface switching
          - **MCP protocol** - Native Model Context Protocol support, connecting a rich tool ecosystem
          - **Session management** - SQLite storage, shared data with the CLI
          - **Streaming responses** - real-time chat with chain-of-thought display
          - **Message queueing** - auto-queue when the agent is busy
          - **Built-in configuration** - configure Provider / Vision / MCP / Skills from the Web UI

          ### Tech Stack
          Electron 43 · TypeScript · Node.js · SQLite · Anthropic SDK · OpenAI SDK · MCP SDK

          ### Changelog

          MD

          COUNT=0
          append_group() {
            local key="$1" header="$2"
            if [ -s "$TMP/$key" ]; then
              printf '### %s\n\n' "$header" >> "$BODY"
              cat "$TMP/$key" >> "$BODY"
              printf '\n' >> "$BODY"
              COUNT=$((COUNT + 1))
            fi
          }

          append_group feat     "✨ Features"
          append_group fix      "🐛 Fixes"
          append_group perf     "⚡ Performance"
          append_group refactor "♻️ Refactor"
          append_group chore    "🔧 Maintenance"
          append_group docs     "📝 Docs"
          append_group test     "✅ Tests"
          append_group build    "🔨 Build"
          append_group style    "🎨 Style"
          append_group other    "📦 Other"

          if [ "$COUNT" -eq 0 ]; then
            printf -- '- No new commits\n' >> "$BODY"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin newest nexus-coder (latest vs beta)
        run: node scripts/set-core-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate icons
        run: npm run icon

      - name: Prepare Electron native
        run: npm run prepare:electron-native

      - name: Build installer
        # electron-builder downloads toolchains (nsis, 7zip, …); a flaky 504
        # from the runner used to sink the whole job. Retry transient failures.
        run: node scripts/retry.mjs --attempts 3 --delay 15 -- sh -c "npx electron-builder --win nsis --publish never"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish core update artifact
        run: node scripts/publish-core.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .release_body.md
          # A tag containing '-' (e.g. v0.3.4-beta.1) becomes a GitHub prerelease.
          # electron-updater ignores prereleases by default, so stable users are
          # not auto-updated into an unnotarized mac build. Regular vX.Y.Z tags
          # are unaffected (contains() is false).
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/nexus-Setup-${{ steps.version.outputs.tag }}.exe
            release/latest.yml
            release/*.blockmap
            release/core-*.tar.gz
            release/latest-core.yml
            release/latest-core.yml.sig
            keys/core-signing-public.pem

      - name: Publish Gitee Release
        shell: bash
        run: |
          set -euo pipefail
          # Mirror the release tag so the Gitee release resolves to a real ref
          git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/cict_1_0/nexus-desktop.git" "${GITHUB_REF_NAME}" || \
            echo "Gitee tag push skipped (non-fatal)"
          GITEE_REPO=cict_1_0/nexus-desktop \
          GITEE_TAG="${GITHUB_REF_NAME}" \
          GITEE_NAME="${{ steps.version.outputs.tag }}" \
          GITEE_BODY_FILE=".release_body.md" \
          GITEE_RELEASE_DIR="release" \
          CORE_SIGNING_KEY="${CORE_SIGNING_KEY}" \
          node scripts/gitee-publish.mjs
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}

  # ───────────────────────────────────────────────────────────────────────────
  # Linux packaging (AppImage + deb).
  #
  # electron-builder cannot cross-build AppImage/deb from Windows (the AppImage
  # toolchain and `fpm` both use platform-specific binaries), so this job
  # runs on `ubuntu-latest`.
  #
  # `needs: build-and-release` ensures the GitHub Release (created by the
  # Windows job) already exists, so this job just appends its assets. It also
  # means the Gitee release was (re)created first, so the Gitee step below can
  # attach the Linux manifest without creating a second release.
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        shell: bash
        run: node scripts/set-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin newest nexus-coder (latest vs beta)
        run: node scripts/set-core-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate icons
        # electron does offscreen SVG rasterization (capturePage); on a
        # headless CI runner it needs an X display, so wrap in xvfb.
        # `ELECTRON_DISABLE_SANDBOX=1` guards against a runner without the
        # SUID sandbox helper.
        run: xvfb-run -a npm run icon
        env:
          ELECTRON_DISABLE_SANDBOX: "1"

      - name: Prepare Electron native
        run: npm run prepare:electron-native

      - name: Build Linux packages
        # Target order matters: AppImage is built from `linux-unpacked`
        # BEFORE the deb target writes `resources/package-type`, so the
        # AppImage does not carry a `package-type` marker. If the order
        # regressed, electron-updater would treat the AppImage as a deb
        # install and pick DebUpdater (broken self-update).
        run: node scripts/retry.mjs --attempts 3 --delay 15 -- sh -c "npx electron-builder --linux AppImage deb --publish never"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Linux artifacts
        run: node scripts/verify-linux-release.mjs

      - name: Upload Linux assets to GitHub Release
        # The Release was created by the Windows job; gh release upload
        # appends to it. `--clobber` replaces same-named assets on re-run.
        # Kept on a single line: a backslash-continuation inside a YAML
        # multi-line `run:` would keep the next line's leading spaces as
        # part of the first filename, and `gh` treats that as a literal
        # glob ("no matches found for ` release/...`").
        run: gh release upload "${{ github.ref_name }}" release/nexus-x86_64.AppImage "release/nexus-${{ steps.version.outputs.tag }}-amd64.deb" release/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Linux manifest to Gitee
        shell: bash
        # Only the manifest (~1 KB) is mirrored to Gitee. The AppImage and
        # the deb both exceed Gitee's 100 MiB attachment cap, and the 98 MiB
        # Windows exe already stalls the intercontinental link on upload
        # (see the v0.3.1 incident). `gitee-publish.mjs` (GITEE_LINUX_ONLY=1)
        # rewrites the manifest's `files[].url` lines to GitHub absolute
        # addresses, so discovery works from Gitee while the download still
        # comes from GitHub / mirrors.
        #
        # Non-fatal: the Gitee manifest is a discovery fallback, not a gate.
        run: |
          GITEE_PRESERVE_ASSETS=1 \
          GITEE_LINUX_ONLY=1 \
          GITEE_REPO=cict_1_0/nexus-desktop \
          GITEE_TAG="${GITHUB_REF_NAME}" \
          GITEE_RELEASE_DIR="release" \
          node scripts/gitee-publish.mjs || \
            echo "gitee linux manifest attach failed (non-fatal)"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # macOS packaging (arm64, ad-hoc signed — beta stage, see RELEASE.md §2.6).
  #
  # Mirrors the validated dry run in .github/workflows/mac-package-test.yml
  # step-for-step, but uploads into the GitHub Release that build-and-release
  # already created. Runs in parallel with build-linux (both `needs` only the
  # Windows job), so a mac failure does NOT block the Linux release: it just
  # means the Release is missing its mac assets. Recovery: re-run this single
  # job (gh run rerun --job) — the upload step uses --clobber, so it attaches
  # cleanly to the existing release.
  #
  # Beta-stage invariants (keep in sync with mac-package-test.yml):
  #   - ad-hoc signed, not notarized (mac.identity: "-" in package.json)
  #   - arm64 only (mac.target in package.json is pinned)
  #   - self-update reports `unsupported` on darwin (src/main/updater.ts), so
  #     latest-mac.yml is inert until a Developer ID + notarized build lands
  #   - NOT mirrored to Gitee (dmg is large + slow cross-continent link);
  #     mac beta assets live on GitHub only
  # ───────────────────────────────────────────────────────────────────────────
  build-mac:
    needs: build-and-release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        shell: bash
        run: node scripts/set-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin newest nexus-coder (latest vs beta)
        run: node scripts/set-core-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (system-Node worker)
        run: npm run test:smoke
        env:
          ANTHROPIC_API_KEY: ci-placeholder-key

      - name: Generate icons (.icns)
        # electron does offscreen SVG rasterization; on a macOS runner this
        # works without an X display. `iconutil -c icns` produces
        # build/icon.icns.
        run: npm run icon

      # Compile better-sqlite3 for the Electron ABI (arm64).
      #
      # Intentionally NOT cached: `actions/cache` would restore the npm
      # system-Node-ABI prebuild into .native/electron/node_modules/.../prebuilds,
      # and `prepare-electron-native`'s stamp check would then short-circuit and
      # skip the source compile — leaving the asar with a Node-ABI binary that
      # does not load under Electron 43. Compiling from source on a macOS
      # runner is ~30–60s, cheap enough to always run.
      - name: Prepare Electron native
        env:
          NATIVE_ARCH: arm64
        run: npm run prepare:electron-native

      - name: Build macOS packages
        # dmg (user-facing) + zip (the carrier a future notarized build will
        # use for Mac auto-update; building it now keeps latest-mac.yml
        # complete). --publish never keeps the upload step in this workflow
        # the single source of truth for what lands in the Release.
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          # Ad-hoc identity is set via mac.identity: "-" in package.json;
          # disable cert discovery so a stray Developer ID on the runner can
          # never leak into the beta build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS artifacts
        run: node scripts/verify-mac-release.mjs --arch arm64

      - name: Launch smoke test (packaged .app)
        # Runs the real .app binary with an isolated HOME; waits for the app's
        # own log to show core init. Proves the native module actually loaded.
        run: node scripts/smoke-launch-mac.mjs --arch arm64

      - name: Upload macOS assets to GitHub Release
        # The Release was created by the Windows job; gh release upload
        # appends to it. Kept on a single line: a backslash-continuation
        # inside a YAML multi-line `run:` would keep the next line's leading
        # spaces as part of the first filename (same trap as build-linux).
        run: gh release upload "${{ github.ref_name }}" "release/nexus-${{ steps.version.outputs.tag }}-arm64.dmg" "release/nexus-${{ steps.version.outputs.tag }}-arm64.zip" release/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
