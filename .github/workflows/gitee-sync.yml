name: Gitee Sync

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mirror main + tags to Gitee
        shell: bash
        run: |
          set -euo pipefail
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/cict_1_0/nexus-desktop.git"
          git config http.postBuffer 524288000
          for attempt in 1 2 3; do
            echo "--- gitee mirror attempt ${attempt} ---"
            if git push gitee main --force && git push gitee --tags --force; then
              echo "gitee mirror OK"
              exit 0
            fi
            echo "gitee mirror attempt ${attempt} failed, retrying..."
            sleep 10
          done
          echo "gitee mirror failed after 3 attempts"
          exit 1
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
