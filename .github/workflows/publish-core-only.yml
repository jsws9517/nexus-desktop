name: Publish Core Update

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: 'nexus-coder version to publish (default: latest on npm)'
        required: false
        type: string
  repository_dispatch:
    types: [nexus-coder-publish]

permissions:
  contents: write

jobs:
  publish-core:
    runs-on: windows-latest
    # ~9 min npm-metadata wait (publish->dispatch race) + pack + uploads.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Determine core version
        id: core
        shell: bash
        run: |
          # repository_dispatch with client_payload, or manual dispatch with input
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.core_version }}" ]; then
            echo "version=${{ inputs.core_version }}" >> $GITHUB_OUTPUT
          else
            # No version specified: query npm for the latest
            VERSION=$(npm view nexus-coder version --registry https://registry.npmjs.org/)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "No version specified; resolved latest nexus-coder from npm: $VERSION"
          fi

      - name: Verify core signing key
        shell: bash
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
        run: |
          if [ -z "${CORE_SIGNING_KEY}" ]; then
            echo "::error::CORE_SIGNING_KEY secret is missing; cannot sign core manifest."
            exit 1
          fi
          case "$CORE_SIGNING_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::CORE_SIGNING_KEY is not a PEM private key."; exit 1 ;;
          esac

      - name: Find target desktop release
        id: release
        shell: bash
        run: |
          # Newest non-prerelease desktop release on GitHub is the target
          # for the core overlay. Fail hard when it cannot be resolved:
          # guessing (a hardcoded tag) is how a future v0.4.0 would get its
          # core update attached to a stale v0.3.0 release.
          TAG=$(gh api repos/jsws9517/nexus-desktop/releases --jq 'first(.[] | select(.prerelease | not) | .tag_name)' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve the newest non-prerelease desktop release; refusing to guess a target tag"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target release: $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish core artifact
        run: node scripts/publish-core.mjs --version "${{ steps.core.outputs.version }}" --release-tag "${{ steps.release.outputs.tag }}"
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}

      - name: Upload core artifacts to desktop release
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.core.outputs.version }}"
          echo "Uploading core v$VERSION assets to release $TAG"
          for f in "release/core-${VERSION}.tar.gz" "release/latest-core.yml" "release/latest-core.yml.sig"; do
            if [ -f "$f" ]; then
              echo "  uploading: $f"
              gh release upload "$TAG" "$f" --repo jsws9517/nexus-desktop || {
                echo "  warning: $f upload failed (may already exist); trying --clobber"
                gh release upload "$TAG" "$f" --repo jsws9517/nexus-desktop --clobber 2>/dev/null \
                  || echo "  warning: $f clobber also failed; release may already have this asset"
              }
            else
              echo "  warning: $f not found, skipping"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mirror core artifacts to Gitee
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          # gitee-publish.mjs reads the release body from this file. The full
          # desktop release flow generates it (changelog step); the core-only
          # flow does not, so write a fallback body first.
          [ -f .release_body.md ] || printf '# Core update (nexus-coder)\n\nCore-only publish; no desktop changelog in this run.\n' > .release_body.md
          # PRESERVE: a core-only publish must never wipe the desktop release's
          # assets (latest.yml / installer / blockmap). Keep the existing
          # Gitee release, attach only what is missing.
          GITEE_REPO=cict_1_0/nexus-desktop \
          GITEE_TAG="${TAG}" \
          GITEE_NAME="${TAG}" \
          GITEE_BODY_FILE=".release_body.md" \
          GITEE_RELEASE_DIR="release" \
          GITEE_PRESERVE_ASSETS=1 \
          CORE_SIGNING_KEY="${CORE_SIGNING_KEY}" \
          node scripts/gitee-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
      - name: Print manifest for review
        run: cat release/latest-core.yml
