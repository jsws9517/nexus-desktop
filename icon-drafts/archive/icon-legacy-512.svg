<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06f0ff"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#b16cf8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06f0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#06f0ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06f0ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b1"/>
      <feGaussianBlur stdDeviation="22" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- tile (full-bleed, no rounded corner gap) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- faint scanning / data plane lines -->
  <g opacity="0.5">
    <line x1="40" y1="150" x2="472" y2="150" stroke="#06f0ff" stroke-width="1" opacity="0.06"/>
    <line x1="40" y1="352" x2="472" y2="352" stroke="#06f0ff" stroke-width="1" opacity="0.06"/>
  </g>
  <rect x="40" y="256" width="432" height="40" fill="url(#scan)"/>

  <!-- HUD corner brackets -->
  <g stroke="url(#brand)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M30 84 V44 H70"/>
    <path d="M482 84 V44 H442"/>
    <path d="M30 428 V468 H70"/>
    <path d="M482 428 V468 H442"/>
  </g>

  <!-- circuit traces rising from corners toward the letters -->
  <g fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M74 120 H150 L176 150 V190"/>
    <path d="M438 120 H362 L336 150 V176"/>
    <path d="M74 392 H120 L148 366 V328"/>
    <path d="M438 392 H404 L356 336"/>
  </g>
  <!-- trace nodes -->
  <g fill="url(#brand)" opacity="0.9">
    <circle cx="176" cy="202" r="6"/>
    <circle cx="336" cy="176" r="6"/>
    <circle cx="148" cy="316" r="6"/>
    <circle cx="424" cy="336" r="6"/>
  </g>

  <!-- wide neon halo behind the letters -->
  <g filter="url(#soft)" opacity="0.55">
    <text x="246" y="300" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="150" text-anchor="middle"
          fill="url(#brand)" letter-spacing="18">NS</text>
  </g>

  <!-- main letters -->
  <g filter="url(#glow)">
    <text x="256" y="300" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="158" text-anchor="middle"
          fill="url(#brand)" letter-spacing="16">NS</text>
  </g>

  <!-- subtle baseline under letters -->
  <line x1="40" y1="412" x2="472" y2="412" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="256" cy="412" r="5" fill="#06f0ff" opacity="0.9"/>
</svg>